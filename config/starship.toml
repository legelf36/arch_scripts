palette = "omarchy"
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:color3 bg:color0)\
$os\
$hostname\
$directory\
[](fg:color3 bg:color6)\
$git_branch\
$git_status\
[](fg:color6 bg:color5)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$lua\
[](fg:color5 bg:color4)\
[](fg:color4 bg:color3)\
$sudo\
[ ](fg:color3 bg:color0)\
$cmd_duration\
$line_break\
$character"""

continuation_prompt = "[∙](color15) "
scan_timeout = 30
command_timeout = 500
add_newline = false
follow_symlinks = true

[sudo]
style = "bg:color2 fg:color0"
symbol = '🧙'
disabled = false

[os]
disabled = false
style = "bg:color3 fg:color0"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[hostname]
ssh_only = false
ssh_symbol = "🌐"
style = "bg:color3 fg:color0"
format = '[ $ssh_symbol]($style bold)[$hostname]($style bold)'
disabled = false

[username]
show_always = true
style_user = "bg:color3 fg:color0"
style_root = "bg:#ff0000 fg:color0"
format = '[ $user ]($style)'

[directory]
style = "bg:color3 fg:color0"
format = "[ $path ]($style italic)"
truncation_length = 9
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color6"
format = '[[ $symbol $branch ](fg:color0 bg:color6)]($style)'

[git_status]
style = "bg:color6"
format = '[[( $all_status$ahead_behind )](fg:color0 bg:color6)]($style)'
conflicted = '🏳'
ahead = '🏎💨'
behind = '😰'
diverged = '😵'
up_to_date = '✓'
untracked = '🤷'
stashed = '📦'
modified = '📝'
staged = '[++\($count\)](#00ff00)'
renamed = '👅'
deleted = '🗑'

[nodejs]
symbol = ""
style = "bg:color5"
format = '[[ $symbol( $version) ](fg:color0 bg:color5)]($style)'

[c]
symbol = " "
style = "bg:color5"
format = '[[ $symbol( $version) ](fg:color0 bg:color5)]($style)'

[rust]
symbol = ""
style = "bg:color5"
format = '[[ $symbol( $version) ](fg:color0 bg:color5)]($style)'

[golang]
symbol = ""
style = "bg:color5"
format = '[[ $symbol( $version) ](fg:color0 bg:color5)]($style)'

[php]
symbol = ""
style = "bg:color5"
format = '[[ $symbol( $version) ](fg:color0 bg:color5)]($style)'

[java]
symbol = " "
style = "bg:color5"
format = '[[ $symbol( $version) ](fg:color0 bg:color5)]($style)'

[kotlin]
symbol = ""
style = "bg:color5"
format = '[[ $symbol( $version) ](fg:color0 bg:color5)]($style)'

[haskell]
symbol = ""
style = "bg:color5"
format = '[[ $symbol( $version) ](fg:color0 bg:color5)]($style)'
[python]
symbol = ""
style = "bg:color5"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:color0 bg:color5)]($style)'

[lua]
lua_binary = 'lua'
symbol = "🌙 "
style = "bg:color5"
format = '[[ $symbol( $version) ](fg:color0 bg:color5)]($style)'

[docker_context]
symbol = ""
style = "bg:color5"
format = '[[ $symbol( $context) ](fg:color0 bg:color5)]($style)'

[conda]
symbol = "  "
style = "fg:color0 bg:color5"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:color2"
format = '[[  $time ](fg:color0 bg:color2)]($style)'

[line_break]
disabled = false

[character]
format = "$symbol "
disabled = false
success_symbol = '[❯](bold fg:color6)'
error_symbol = '[❯](bold fg:#ff0000)'
vimcmd_symbol = '[❮](bold fg:#00ff00)'
vimcmd_replace_one_symbol = '[❮](bold fg:color0)'
vimcmd_replace_symbol = '[❮](bold fg:color0)'
vimcmd_visual_symbol = '[❮](bold fg:color0)'

[cmd_duration]
show_milliseconds = true
style = "fg:color15 bg:color0"
format = '[ $duration ]($style bold)'
disabled = false
show_notifications = false
min_time_to_notify = 45000
min_time = 1


